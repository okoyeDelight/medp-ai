name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # package-lock.json is currently out of sync with package.json. Temporarily ignore it
        # so checks can run while a maintainer regenerates and commits the lockfile.
        # Restore npm ci as soon as the lockfile is repaired.
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck application and build configuration
        if: success() || failure()
        run: npm run typecheck

      - name: Run tests
        if: success() || failure()
        run: npm test

      - name: Validate reference data importer
        if: success() || failure()
        run: node --test scripts/import-rxnorm-ingredients.test.mjs

      - name: Build production bundle
        if: success() || failure()
        run: npm run build
