name: Bug report
description: Report a reproducible software problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, access tokens, real patient information, or other sensitive data. For security vulnerabilities, follow SECURITY.md instead of opening a public issue."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, safe reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and app version or commit.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Redact all personal information and secrets.
    validations:
      required: false
